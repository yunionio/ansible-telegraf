---
# tasks file for ansible-telegraf

- name: "Check offline installation preconditions"
  fail:
    msg: >-
      telegraf_agent_package_local_dir must be set when
      telegraf_agent_package_method is "offline", so that the telegraf package
      shipped with the ansibleserver can be used
  when:
    - telegraf_agent_package_method == "offline"
    - telegraf_agent_package_local_dir | default('') == ''
    - not telegraf_agent_docker

- name: "Check if Telegraf bin exists" 
  stat:
    path: /usr/bin/telegraf
  register: telegraf_bin
  when:
    - ansible_os_family != "Windows"
    - not telegraf_agent_docker

- name: "Check Telegraf version"
  command: "/usr/bin/telegraf --version"
  register: telegraf_current_version
  when:
    - ansible_system == 'Linux'
    - telegraf_bin.stat.exists == True
  changed_when: False
  failed_when: False

# Default so later tasks can safely read telegraf_remove.changed even when
# neither removal path runs (e.g. telegraf is not installed yet).
- name: "Initialize telegraf removal result"
  set_fact:
    telegraf_remove:
      changed: false

- name: "Remove Telegraf with old or disabled version (RedHat offline)"
  # Same rationale as the offline install: rpm avoids yum/dnf repository
  # refreshes on hosts with no usable repos.
  command: rpm -e telegraf
  register: telegraf_remove_rpm
  changed_when: telegraf_remove_rpm.rc == 0
  failed_when: >-
    telegraf_remove_rpm.rc != 0
    and ('is not installed' not in (telegraf_remove_rpm.stderr | default('')))
  become: yes
  when:
    - ansible_os_family == "RedHat"
    - telegraf_agent_package_method == "offline"
    - not telegraf_agent_docker
    - telegraf_bin.stat.exists | bool
    - >
      (
        telegraf_agent_disable_version is not none
        and telegraf_agent_disable_version | length > 0
        and telegraf_current_version.stdout | default('') | regex_search(telegraf_agent_disable_version)
      ) or (
        telegraf_agent_package_state == "latest"
      )

- name: "Record Telegraf removal via rpm"
  set_fact:
    telegraf_remove:
      changed: true
  when:
    - telegraf_remove_rpm is defined
    - telegraf_remove_rpm is changed

- name: "Remove Telegraf with old or disabled version"
  package:
    name: telegraf
    state: absent
  register: telegraf_remove_pkg
  when:
    - not (ansible_os_family == "RedHat" and telegraf_agent_package_method == "offline")
    - ansible_os_family != "Windows"
    - not telegraf_agent_docker
    - telegraf_bin.stat.exists | bool
    - >
      (
        telegraf_agent_disable_version is not none
        and telegraf_agent_disable_version | length > 0
        and telegraf_current_version.stdout | default('') | regex_search(telegraf_agent_disable_version)
      ) or (
        telegraf_agent_package_state == "latest"
      )

- name: "Record Telegraf removal via package manager"
  set_fact:
    telegraf_remove: "{{ telegraf_remove_pkg }}"
  when:
    - telegraf_remove_pkg is defined
    - telegraf_remove_pkg is changed

- name: "Install on RedHat"
  include_tasks: "RedHat.yml"
  when: 
    - ansible_pkg_mgr == 'yum' or ansible_pkg_mgr == 'dnf'
    - (telegraf_bin.stat.exists == False and not telegraf_agent_docker) or telegraf_remove.changed

- name: "Install on Debian"
  include_tasks: "Debian.yml"
  when: 
    - ansible_pkg_mgr == 'apt'
    - (telegraf_bin.stat.exists == False and not telegraf_agent_docker) or telegraf_remove.changed
  tags:
    - telegraf
    - packages

- name: "Install on Suse"
  include_tasks: "Suse.yml"
  when: ansible_os_family == "Suse" and not telegraf_agent_docker

- name: "Install on FreeBSD"
  include_tasks: "FreeBSD.yml"
  when:
    - ansible_os_family == "FreeBSD" and not telegraf_agent_docker

- include_tasks: "docker.yml"
  when: telegraf_agent_docker

- name: "Configure Telegraf"
  include_tasks: "configure_linux.yml"
  when:
    - ansible_os_family != "Windows"

- name: "Install / Configure telegraf on Windows"
  include_tasks: "configure_windows.yml"
  when:
    - ansible_os_family == "Windows" and not telegraf_agent_docker
